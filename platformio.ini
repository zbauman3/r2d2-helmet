; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:kb2040]
; The OFFICIAL platformio raspberrypi platform only ships the Arduino Mbed core
; (verified against platform.json on develop @ 1.20.0 — frameworks: framework-arduino-mbed only).
; Earle Philhower's arduino-pico core requires maxgerhardt's fork.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board     = adafruit_kb2040
framework = arduino

; board_build.core is NOT needed here: boards/adafruit_kb2040.json already sets
;   "core": "earlephilhower", "f_cpu": "133000000L"
; It is only required for dual-core-capable board ids like `pico` / `nanorp2040connect`.

board_build.filesystem_size = 0.5m
monitor_speed = 115200

; To drop to the bare Pico SDK later, the same board id supports it:
;   framework = picosdk

lib_deps =
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
